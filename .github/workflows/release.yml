name: Release

# Push a tag like v0.1.1 (it must match "version" in package.json) to build the
# installer and publish it as a GitHub pre-release with SHA256SUMS.txt.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches package.json
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version. Bump the version, commit, then tag again."
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tests
        shell: powershell
        run: |
          npx eslint library
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run test:library
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -ExecutionPolicy Bypass -File wallpaper\test.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -ExecutionPolicy Bypass -File updater\test.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build the screensaver, wallpaper and updater
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File screensaver\build.ps1

      - name: Build the installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File screensaver\build-installer.ps1 -SkipScreensaverBuild

      - name: Checksums
        shell: powershell
        run: |
          $hash = (Get-FileHash release\ElsewhereWithin-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ElsewhereWithin-Setup.exe" | Out-File release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt

      - name: Publish the pre-release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-Content release\SHA256SUMS.txt).Split(' ')[0]
          $notes = @"
          Pre-release $env:GITHUB_REF_NAME. Tested on one Windows 11 PC; please report problems as an Issue.

          **Install:** download ``ElsewhereWithin-Setup.exe``, run it (SmartScreen: More info > Run anyway), then pick "Elsewhere - <scene>" in Screen Saver Settings. If it is already installed, the updater picks this release up by itself.

          SHA-256 of ElsewhereWithin-Setup.exe: ``$hash``
          "@
          $notes | Out-File release-notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME release\ElsewhereWithin-Setup.exe release\SHA256SUMS.txt --prerelease --title "$env:GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag